<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>OS Scenario 2 — HUD Text & Layout Deck</title>
<style>
:root{
  --bg:#030504; --panel:#070b0a; --panel2:#0a100e; --lime:#d8ff3f; --lime2:#9fb929;
  --red:#ff354e; --white:#eaf1f7; --muted:#8d9ba6; --line:#5b6770; --amber:#ffb93f;
  --mono: "IBM Plex Mono","JetBrains Mono","Noto Sans Mono CJK KR","Noto Sans Mono",Consolas,monospace;
  --sans: Inter,"Pretendard","Noto Sans KR",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:var(--white);font-family:var(--mono)}
body{background:radial-gradient(circle at 50% 40%,#1a1d1c 0,#0c0e0d 42%,#050605 100%)}
#viewport{position:fixed;inset:0;overflow:hidden}
#canvas{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;box-shadow:0 30px 120px rgba(0,0,0,.7)}
.slide{position:absolute;inset:0;background:
  linear-gradient(rgba(216,255,63,.018) 1px,transparent 1px),
  linear-gradient(90deg,rgba(216,255,63,.018) 1px,transparent 1px),
  radial-gradient(circle at 50% 45%,rgba(25,31,28,.72),rgba(3,5,4,.98) 58%);
  background-size:48px 48px,48px 48px,100% 100%;
  padding:50px 84px 48px 84px;
}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.015) 3px 4px)}
.sysbar{position:relative;z-index:3;height:42px;display:flex;align-items:flex-start;justify-content:space-between;font-size:17px;letter-spacing:1.9px;color:#dbe5ec}
.sysbar .brand{padding-bottom:9px;border-bottom:2px solid var(--lime);min-width:510px}
.sysbar .right{display:flex;align-items:center;gap:16px;color:var(--muted)}
.sysbar .ticks{display:flex;gap:7px}.sysbar .ticks i{display:block;width:36px;height:4px;background:var(--lime)}
.cutmeta{position:absolute;left:84px;bottom:42px;z-index:4;display:flex;align-items:flex-end;gap:18px}
.cutno{font-size:19px;letter-spacing:2px}.cutno::before{content:"";display:block;width:38px;height:4px;background:var(--lime);margin-bottom:8px}
.cuttitle{font-family:var(--sans);font-size:13px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.duration{border:1px solid #35403c;padding:5px 9px;color:#83918d;font-size:11px;letter-spacing:1.5px;margin-bottom:-1px}
.hud{height:890px;display:grid;grid-template-columns:550px 450px 520px;gap:58px;justify-content:center;align-items:start;padding-top:23px}
.leftcol,.rightcol{height:825px;display:flex;flex-direction:column;gap:30px}
.panel{position:relative;background:linear-gradient(180deg,rgba(8,13,11,.87),rgba(4,7,6,.72));border:1px solid rgba(127,145,154,.28);clip-path:polygon(0 0,96% 0,100% 7%,100% 100%,4% 100%,0 93%);overflow:hidden}
.panel::after{content:"";position:absolute;inset:0;border-top:1px solid rgba(255,255,255,.04);pointer-events:none}
.today{height:330px;border:none;background:transparent;clip-path:none;padding:10px 4px 0}
.today .big{font-family:var(--sans);font-size:88px;font-weight:900;line-height:.9;color:var(--lime);letter-spacing:-4px;padding-bottom:18px;border-bottom:3px solid var(--lime)}
.schedule{padding-top:22px}.schedule .row{display:grid;grid-template-columns:135px 1fr;gap:18px;align-items:center;margin:17px 0;font-size:24px;letter-spacing:.8px;color:#d8e0e6}
.schedule .row .k{position:relative;padding-left:44px;color:#cbd4db}.schedule .row.active .k::before{content:"";position:absolute;left:3px;top:1px;border-left:20px solid var(--red);border-top:15px solid transparent;border-bottom:15px solid transparent}
.schedule .row.active,.schedule .row.active .k{color:var(--lime)}
.schedule .row.dim{opacity:.46}.today .meta{margin-left:44px;margin-top:8px;font-size:16px;letter-spacing:1.4px;color:#b9c5cb}
.badge{display:inline-block;margin-left:44px;margin-top:12px;border:1px solid var(--lime);color:var(--lime);font-size:12px;padding:6px 10px;letter-spacing:1.5px}
.lower{height:465px;padding:18px 18px 15px;border-top:2px solid var(--lime)}
.ptitle{font-size:20px;color:var(--lime);letter-spacing:1.6px;margin-bottom:16px}
.slotghost{height:320px;border:1px dashed #44504c;display:grid;place-items:center;color:#5f7069;letter-spacing:2px;font-size:16px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 8px,transparent 8px 16px)}
.plantcard{height:330px;display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center}
.plantcard .plantimg{height:250px;background-repeat:no-repeat;background-size:contain;background-position:center;filter:saturate(.92) contrast(1.05)}
.plantcard .copy .h{font-family:var(--sans);font-weight:850;font-size:30px;line-height:1.05}.plantcard .copy .m{margin-top:18px;color:var(--lime);font-size:15px;letter-spacing:1.3px}.plantcard .copy .id{margin-top:10px;color:#8d9aa3;font-size:12px;letter-spacing:1.2px}
.floor{height:314px;border:2px solid #58656d;display:grid;grid-template-columns:1fr 1fr 1.08fr;position:relative;background:rgba(0,0,0,.25)}
.room{position:relative;border-right:2px solid #58656d;display:grid;place-items:center;color:#b7c2c9;font-size:18px;letter-spacing:1px}
.room:last-child{border-right:0}.room::after{content:"";position:absolute;bottom:22px;width:55px;height:38px;border:2px solid #66737a}
.room.on{outline:3px solid var(--lime);outline-offset:-5px;color:var(--lime);background:rgba(216,255,63,.08)}
.room.blocked{background:repeating-linear-gradient(135deg,rgba(255,53,78,.18) 0 7px,transparent 7px 14px);color:#b7c2c9}
.room.blocked::before{content:"ROBOT PRIORITY";position:absolute;top:24px;color:var(--red);font-size:10px;letter-spacing:1.2px}
.room.marker::before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--lime);box-shadow:0 0 20px var(--lime);top:48%;left:47%}
.floor .route{position:absolute;left:70px;right:54px;bottom:47px;border-top:7px dotted var(--lime);height:0}
.floor .route::after{content:"";position:absolute;right:-1px;top:-12px;border-left:22px solid var(--lime);border-top:9px solid transparent;border-bottom:9px solid transparent}
.floor .route.short{left:190px;right:35px}.floor .tasktag{position:absolute;right:18px;top:72px;color:var(--lime);font-size:13px;border-bottom:1px solid var(--lime);padding:4px 8px}
.floorstatus{margin-top:14px;color:#cbd4d9;font-size:17px;letter-spacing:1.5px}
.mirrorcol{height:825px;display:flex;flex-direction:column;align-items:center;position:relative}
.mirrorlabel{height:30px;color:var(--lime);font-size:16px;letter-spacing:2px;margin:0 0 8px}
.mirror{position:relative;width:450px;height:760px;border:3px solid var(--red);border-radius:34px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#101713,#030504 72%);box-shadow:0 0 0 1px rgba(255,53,78,.2),inset 0 0 60px rgba(0,0,0,.8)}
.mirror::before,.mirror::after{content:"";position:absolute;z-index:3;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.mirror::before{top:33%}.mirror::after{top:66%}
.mirrorimg{position:absolute;inset:0;background-repeat:no-repeat;background-position:center bottom;background-size:auto 97%;filter:contrast(1.08) saturate(1.04)}
.mirror.agent .mirrorimg{background-size:auto 95%;background-position:center bottom}
.mirror .scanline{position:absolute;left:0;right:0;height:3px;background:var(--red);box-shadow:0 0 18px var(--red);animation:scan 3.1s linear infinite;z-index:4;opacity:.9}
@keyframes scan{0%{top:7%}100%{top:92%}}
.mirror .overlay{position:absolute;left:18px;top:18px;z-index:5;padding:7px 10px;border-left:3px solid var(--lime);background:rgba(3,5,4,.72);font-size:12px;letter-spacing:1.5px;color:#dfe8ec}
.mirror .waist{position:absolute;z-index:6;left:94px;right:94px;top:338px;height:88px;border:2px solid var(--amber);background:rgba(255,185,63,.09);box-shadow:0 0 26px rgba(255,185,63,.25)}
.mirror .waist::before{content:"LUMBAR LOAD";position:absolute;top:-25px;left:0;color:var(--amber);font-size:11px;letter-spacing:1.2px}
.mirrorstatus{margin-top:10px;color:#dfe8ec;font-size:17px;letter-spacing:1.9px;text-align:center}
.mirrorstatus::after{content:"";display:block;width:34px;height:4px;background:var(--lime);margin:9px auto 0}
.condition{position:relative;height:240px;padding:15px 22px 15px;border:none;background:transparent;clip-path:none}
.labelbar{display:inline-block;background:var(--red);color:#020404;padding:7px 26px;font-size:18px;font-weight:800;letter-spacing:1.6px;min-width:190px;text-align:center}
.labelbar::after{content:"";position:absolute;height:3px;background:var(--red);left:225px;right:16px;top:31px}
.condition .headline{font-family:var(--sans);font-weight:900;font-size:38px;margin:22px 0 8px;line-height:1.05;letter-spacing:.3px}
.condition .sub{font-size:23px;color:#d3dce2;letter-spacing:1.2px}.level{display:flex;gap:10px;margin-top:18px}.level i{width:38px;height:14px;background:#303943}.level i.on{background:var(--red)}
.options{margin-top:18px;display:flex;flex-direction:column;gap:14px}.option{font-size:20px;letter-spacing:1.2px;display:flex;align-items:center;gap:20px}.option i{width:27px;height:27px;border:2px solid #dce6ec;border-radius:50%}.option.sel i{background:var(--lime);border-color:var(--lime);position:relative}.option.sel i::after{content:"✓";position:absolute;color:#121703;left:5px;top:-2px;font-weight:900}.condition .extra{margin-top:15px;color:var(--amber);font-size:13px;letter-spacing:1.5px;border-top:1px solid #46504d;padding-top:10px}
.service{height:555px;padding:18px 22px 18px;border-color:rgba(216,255,63,.72)}
.service.red{border-color:rgba(255,53,78,.85)}.service .shead{font-family:var(--sans);font-size:33px;font-weight:900;line-height:1.02;margin:18px 0 10px}.service .simg{height:250px;background-repeat:no-repeat;background-position:center;background-size:contain;margin:3px 0 8px;filter:contrast(1.04)}
.service .rows{border-top:2px solid var(--lime);padding-top:10px}.service.red .rows{border-top-color:var(--red)}.srow{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;padding:8px 0;border-bottom:1px solid rgba(130,145,153,.18);font-size:15px;letter-spacing:1px}.srow .k{color:#84939d}.srow .v{color:#e5edf1;text-align:right}.srow.good .v{color:var(--lime)}
.progress{height:15px;background:#303943;margin:10px 0 7px;position:relative}.progress i{display:block;height:100%;background:var(--lime);width:58%}
.service .buttons{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}.service .btn{height:54px;border:2px solid #9eabb1;display:grid;place-items:center;font-size:17px;letter-spacing:1.4px}.service .btn.primary{border-color:var(--lime);color:var(--lime);background:rgba(216,255,63,.06)}
.checklist{display:flex;flex-direction:column;gap:15px;margin-top:18px}.check{display:flex;justify-content:space-between;border-bottom:1px solid #2d3734;padding:0 0 12px;font-size:16px}.check .v{color:var(--lime)}
.recordaction{height:56px;border:2px solid var(--lime);color:var(--lime);display:flex;align-items:center;gap:20px;padding:0 18px;font-size:18px;margin-top:12px}.recordaction::before{content:"";border-left:18px solid var(--lime);border-top:11px solid transparent;border-bottom:11px solid transparent}
.collapse .today,.collapse .lower,.collapse .condition,.collapse .service{opacity:.25;transform:scale(.96);filter:grayscale(.4)}
.collapse .mirror{box-shadow:0 0 90px rgba(216,255,63,.08),inset 0 0 60px rgba(0,0,0,.8)}
/* access */
.accesswrap{height:900px;display:grid;place-items:center;position:relative}.accesscard{width:760px;padding:42px 55px 45px;border:2px solid var(--lime);clip-path:polygon(0 0,94% 0,100% 12%,100% 100%,6% 100%,0 88%);background:rgba(4,8,6,.88);box-shadow:0 0 80px rgba(216,255,63,.07)}
.accesscard .aeye{color:var(--red);font-size:15px;letter-spacing:2.4px}.accesscard .ahead{font-family:var(--sans);font-size:58px;font-weight:900;margin:16px 0 4px}.accesscard .asub{color:var(--lime);font-size:21px;letter-spacing:1.5px;margin-bottom:32px}.arow{display:grid;grid-template-columns:1fr 1.4fr;border-top:1px solid #34413c;padding:15px 0;font-size:17px;letter-spacing:1.2px}.arow span:first-child{color:#7e8f88}.arow span:last-child{text-align:right}.wave{height:90px;display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0}.wave i{width:5px;background:var(--red);animation:wave 1.2s ease-in-out infinite}.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}@keyframes wave{0%,100%{height:12px}50%{height:70px}}
.connectline{border-top:2px solid var(--lime);padding-top:18px;color:var(--lime);font-size:18px;letter-spacing:1.8px;text-align:center}.connectline::after{content:"";display:block;height:8px;background:linear-gradient(90deg,var(--lime) 0 72%,#29322f 72%);margin-top:16px}
/* sector */
.sectorwrap{height:900px;position:relative;margin:-2px -84px 0;overflow:hidden}.sectorbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.75) brightness(.34);transform:scale(1.04)}.sectorwrap::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,transparent 0 18%,rgba(3,5,4,.24) 35%,rgba(3,5,4,.87) 75%)}
.sectorcard{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-48%);width:700px;padding:36px 44px;background:rgba(2,5,4,.9);border:2px solid var(--red);clip-path:polygon(0 0,94% 0,100% 10%,100% 100%,6% 100%,0 90%)}.sectorcard .ahead{font-family:var(--sans);font-size:54px;font-weight:900}.sectorcard .asub{font-size:18px;color:var(--lime);letter-spacing:1.5px;margin:8px 0 28px}.sectorpulse{position:absolute;z-index:2;left:50%;top:51%;width:760px;height:760px;transform:translate(-50%,-50%);border:2px solid var(--lime);border-radius:50%;box-shadow:0 0 80px rgba(216,255,63,.25);animation:pulse 2.2s ease-out infinite}@keyframes pulse{0%{opacity:.9;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
/* production note / UI */
.notechip{position:absolute;z-index:7;right:84px;bottom:36px;width:700px;text-align:right;color:#84938d;font-family:var(--sans);font-size:13px;line-height:1.5}.notechip b{color:var(--lime);font-family:var(--mono);letter-spacing:1px;margin-right:8px}
#controls{position:fixed;z-index:30;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(6,8,7,.88);border:1px solid #2f3935;padding:8px 10px;backdrop-filter:blur(12px);border-radius:8px}
#controls button{appearance:none;border:1px solid #46534e;background:#0b100e;color:#dce5e9;font-family:var(--mono);font-size:12px;letter-spacing:1px;padding:8px 13px;cursor:pointer}#controls button:hover{border-color:var(--lime);color:var(--lime)}#counter{min-width:80px;text-align:center;padding:8px 5px;font-size:12px;color:#9eaaa6}
#drawer{position:fixed;z-index:40;top:0;right:0;width:510px;height:100%;background:rgba(5,8,7,.97);border-left:1px solid #34423d;transform:translateX(100%);transition:.28s ease;overflow:auto;padding:28px 26px 60px;box-shadow:-30px 0 80px rgba(0,0,0,.5)}#drawer.open{transform:translateX(0)}#drawer h2{font-family:var(--sans);font-size:25px;margin:0 0 4px}#drawer .dmeta{color:var(--lime);font-size:12px;letter-spacing:1.5px;margin-bottom:22px}.zone{border-top:1px solid #33403b;padding:16px 0}.zone h3{font-size:13px;color:var(--red);letter-spacing:1.2px;margin:0 0 9px}.zone pre{white-space:pre-wrap;margin:0;font-family:var(--mono);font-size:13px;line-height:1.7;color:#d4dde1}.copybtn{float:right;border:0;background:transparent;color:#70807a;cursor:pointer;font-family:var(--mono);font-size:10px}.copybtn:hover{color:var(--lime)}#closeDrawer{position:absolute;right:18px;top:18px;border:1px solid #46534e;background:#0b100e;color:white;width:34px;height:34px;cursor:pointer}
#help{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center}#help.open{display:grid}.helpbox{width:560px;background:#07100d;border:1px solid var(--lime);padding:30px 36px;font-family:var(--sans)}.helpbox h2{margin:0 0 16px}.helpbox p{color:#b8c4c0;line-height:1.7}.keys{display:grid;grid-template-columns:90px 1fr;gap:10px}.keys b{color:var(--lime)}
.clean #controls,.clean .notechip{display:none}.clean #drawer{display:none}
@media print{html,body{overflow:visible;background:white}#viewport{position:static;overflow:visible}#canvas{position:relative;transform:none!important;left:0!important;top:0!important;page-break-after:always}#controls,#drawer,#help{display:none!important}}
</style>
</head>
<body>
<div id="viewport"><div id="canvas"></div></div>
<div id="controls">
  <button id="prev">← PREV</button><span id="counter">01 / 14</span><button id="next">NEXT →</button>
  <button id="textmap">TEXT MAP</button><button id="helpbtn">?</button>
</div>
<aside id="drawer"><button id="closeDrawer">×</button><div id="drawerBody"></div></aside>

 let c='';
 if(p.type==='slots') c=`<div class="slotghost">${esc(p.message)}</div>`;
 else if(p.type==='plant') c=`<div class="plantcard"><div class="plantimg" style="background-image:url('${ASSETS.plant}')"></div><div class="copy"><div class="h">${esc(p.headline)}</div><div class="m">${esc(p.meta)}</div><div class="id">SAMPLE ID / PL-1400-B</div></div></div>`;
 else if(p.type==='floor') c=floorHTML(p);
 else c=`<div class="slotghost">${esc(p.message||'SAMPLE RECORDS / OPEN')}</div>`;
 return `<section class="panel lower ${p.collapse?'collapse':''}"><div class="ptitle">${esc(p.title)}</div>${c}</section>`;
}
function mirror(p){
 return `<div class="mirrorcol"><div class="mirrorlabel">${esc(p.eyebrow||'WORK MIRROR')}</div><div class="mirror ${p.asset==='agent'?'agent':''}"><div class="mirrorimg" style="background-image:url('${ASSETS[p.asset]}')"></div>${p.scan?'<div class="scanline"></div>':''}<div class="overlay">${esc(p.overlay||'')}</div>${p.waist?'<div class="waist"></div>':''}</div><div class="mirrorstatus">${esc(p.status)}</div></div>`;
}
function condition(p){
 let body='';
 if(p.mode==='question') body=`<div class="headline">${esc(p.headline)}</div><div class="options">${p.options.map((o,i)=>`<div class="option ${i===p.selected?'sel':''}"><i></i><span>${esc(o)}</span></div>`).join('')}</div>`;
 else body=`<div class="headline">${esc(p.headline)}</div><div class="sub">${esc(p.sub||'')}</div><div class="level"><i class="on"></i><i class="${(p.level||0)>1?'on':''}"></i><i class="${(p.level||0)>2?'on':''}"></i></div>${p.extra?`<div class="extra">${esc(p.extra)}</div>`:''}`;
 return `<section class="condition ${p.collapse?'collapse':''}"><div class="labelbar">CONDITION</div>${body}</section>`;
}
function srows(rows){return (rows||[]).map((r,i)=>`<div class="srow ${/READY|CONFIRMED|ARRIVED|PREPARED|PARKED|SECURED|ACTIVE|BOOKED/.test(r[1])?'good':''}"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join('')}
function service(p){
 let image='', extra='', cls='';
 if(p.type==='mobility'){image=`<div class="simg" style="background-image:url('${ASSETS.car}')"></div><div class="progress"><i></i></div>`}
 if(p.type==='spot'){image=`<div class="simg" style="background-image:url('${ASSETS.spot}')"></div>`;cls='red'}
 if(p.type==='delivery'){image=`<div class="simg" style="background-image:url('${ASSETS.delivery}')"></div>`;cls='red'}
 if(p.type==='xble_offer'||p.type==='xble_ready'){image=`<div class="simg" style="background-image:url('${ASSETS.xble}')"></div>`;cls=p.type==='xble_offer'?'red':''; if(p.type==='xble_offer') extra='<div class="buttons"><div class="btn primary">PREPARE</div><div class="btn">LATER</div></div>'}
 if(p.type==='records'){image=`<div class="simg" style="background-image:url('${ASSETS.plant}')"></div>`;extra='<div class="recordaction">OPEN RECORD</div>'}
 if(p.type==='summary'){extra=`<div class="checklist">${p.rows.map(r=>`<div class="check"><span>${esc(r[0])}</span><span class="v">✓ ${esc(r[1])}</span></div>`).join('')}</div>`}
 const rows=p.type==='summary'?'':`<div class="rows">${srows(p.rows)}</div>`;
 return `<section class="panel service ${cls} ${p.collapse?'collapse':''}"><div class="labelbar">${esc(p.label)}</div><div class="shead">${esc(p.headline)}</div>${image}${rows}${extra}</section>`;
}
function renderHUD(s){const collaps=s.mirror.collapse?'collapse':'';return `<div class="slide ${collaps}">${sysbar()}<main class="hud"><div class="leftcol">${today(s.today)}${lower(s.lower)}</div>${mirror(s.mirror)}<div class="rightcol">${condition(s.condition)}${service(s.service)}</div></main>${cutmeta(s)}${note(s)}</div>`}
function renderAccess(s){return `<div class="slide">${sysbar('OS / CITIZEN ACCESS','SCENARIO 02 / PERSONAL LINK')}<div class="accesswrap"><div class="accesscard"><div class="aeye">PERSONAL CONNECTION</div><div class="ahead">${esc(s.headline)}</div><div class="asub">${esc(s.sub)}</div>${s.accessRows.map(r=>`<div class="arow"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('')}<div class="wave">${Array.from({length:31},(_,i)=>`<i style="animation-delay:${(i%7)*.08}s"></i>`).join('')}</div><div class="connectline">${esc(s.status)}</div></div></div>${cutmeta(s)}${note(s)}</div>`}
function renderSector(s){return `<div class="slide">${sysbar('OS / SECTOR ALLOCATION','H SMART CITY / PERSONAL LAYER')}<div class="sectorwrap"><div class="sectorbg" style="background-image:url('${ASSETS.city_map}')"></div><div class="sectorpulse"></div><div class="sectorcard"><div class="aeye">PERSONAL SECTOR</div><div class="ahead">${esc(s.headline)}</div><div class="asub">${esc(s.sub)}</div>${s.sectorRows.map(r=>`<div class="arow"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('')}<div class="connectline">${esc(s.status)}</div></div></div>${cutmeta(s)}${note(s)}</div>`}
function render(){
 const s=SLIDES[index]; document.getElementById('canvas').innerHTML=s.kind==='hud'?renderHUD(s):s.kind==='access'?renderAccess(s):renderSector(s);
 document.getElementById('counter').textContent=String(index+1).padStart(2,'0')+' / '+String(SLIDES.length).padStart(2,'0');
 renderDrawer(); history.replaceState(null,'','?slide='+index+(document.body.classList.contains('clean')?'&clean=1':''));
}
function renderDrawer(){const s=SLIDES[index];document.getElementById('drawerBody').innerHTML=`<h2>${esc(s.cut)} · ${esc(s.title)}</h2><div class="dmeta">${esc(s.scene)} / SCREEN COPY MAP</div>${s.zones.map((z,i)=>`<section class="zone"><button class="copybtn" data-copy="${i}">COPY</button><h3>${esc(z[0])}</h3><pre>${esc(z[1].join('\n'))}</pre></section>`).join('')}<section class="zone"><h3>제작 메모</h3><pre>${esc(s.note)}</pre></section>`;document.querySelectorAll('.copybtn').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(s.zones[Number(b.dataset.copy)][1].join('\n')))}
function go(n){index=(n+SLIDES.length)%SLIDES.length;render()}
function fit(){const c=document.getElementById('canvas');const scale=Math.min(innerWidth/1920,innerHeight/1080);c.style.transform=`scale(${scale})`;c.style.left=((innerWidth-1920*scale)/2)+'px';c.style.top=((innerHeight-1080*scale)/2)+'px'}
addEventListener('resize',fit);fit();render();
document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const drawer=document.getElementById('drawer');document.getElementById('textmap').onclick=()=>drawer.classList.toggle('open');document.getElementById('closeDrawer').onclick=()=>drawer.classList.remove('open');
const help=document.getElementById('help');document.getElementById('helpbtn').onclick=()=>help.classList.add('open');help.onclick=e=>{if(e.target===help)help.classList.remove('open')};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(index+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(index-1);if(e.key.toLowerCase()==='t')drawer.classList.toggle('open');if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}if(e.key==='Escape'){drawer.classList.remove('open');help.classList.remove('open')}})
</script>
</body></html>
